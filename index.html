<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yahweh Puppy Farm - Divine Companions for Your Family</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
        :root {
            --primary: #f97316; /* Sunset Orange */
            --primary-hover: #ea580c;
            --primary-light: #fff7ed;
            --primary-border: #ffedd5;
            --primary-shadow: rgba(249, 115, 22, 0.2);
            --gold: #d4af37;
            --gold-hover: #b8962e;
            
            /* Light Theme Defaults */
            --bg-main: #ffffff;
            --bg-surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-main: #f1f5f9;
            --card-bg: #ffffff;
            --nav-bg: rgba(255, 255, 255, 0.8);
        }

        html.dark {
            --bg-main: #020617;
            --bg-surface: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-main: #1e293b;
            --card-bg: #0f172a;
            --nav-bg: rgba(15, 23, 42, 0.8);
            
            /* Adjust primary light/border for dark mode if not set by JS */
            --primary-light: rgba(249, 115, 22, 0.1);
            --primary-border: rgba(249, 115, 22, 0.2);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bg-main { background-color: var(--bg-main); }
        .bg-surface { background-color: var(--bg-surface); }
        .bg-card { background-color: var(--card-bg); }
        .bg-nav { background-color: var(--nav-bg); }
        
        .text-main { color: var(--text-main); }
        .text-muted { color: var(--text-muted); }
        .border-main { border-color: var(--border-main); }

        .bg-primary { background-color: var(--primary); }
        .text-primary { color: var(--primary); }
        .border-primary { border-color: var(--primary); }
        .text-gold { color: var(--gold); }
        .bg-gold { background-color: var(--gold); }
        
        .shadow-premium {
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
        }

        html.dark .shadow-premium {
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
        }

        /* Smooth transitions for theme-aware elements */
        .theme-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
